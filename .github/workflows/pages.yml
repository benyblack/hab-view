name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # run the full gate so a broken site can never deploy
      - run: npm ci
      - run: npm run ci

      - name: Assemble site (landing + docs + demo + modules + every plugin package, nothing else)
        run: |
          mkdir site
          cp -r src demo index.html docs.html plugins.html site/
          mkdir -p site/plugins
          for d in plugins/*/; do
            name=$(basename "$d")
            cp -r "$d" "site/plugins/$name"
            rm -rf "site/plugins/$name/tests"
          done
          find site -name '*.html' -printf '%p\n'

      # the demo boots via relative imports in demo/app.js — if any of them is
      # missing from the artifact the page renders a dead toolbar (this shipped
      # once: plugins/ was hard-coded to draw/ only). Fail the deploy instead.
      - name: Guard — every local reference must resolve inside the artifact
        run: |
          node -e "
          const fs=require('fs'),path=require('path');
          const refs=[];
          const app=fs.readFileSync('demo/app.js','utf8');
          for(const m of app.matchAll(/from\s+'(\.[^']+)'/g)) refs.push(path.join('demo',m[1]));
          for(const m of app.matchAll(/import\s+'(\.[^']+)'/g)) refs.push(path.join('demo',m[1]));
          for(const html of ['demo/index.html','index.html','docs.html','plugins.html']){
            const s=fs.readFileSync(html,'utf8');
            for(const m of s.matchAll(/(?:src|href)=\"(\.[^\"]+)\"/g)) refs.push(path.join(path.dirname(html),m[1]));
          }
          const uniq=[...new Set(refs)];
          const missing=uniq.map(p=>p.split('#')[0]).filter(p=>!fs.existsSync(path.join('site',p)));
          if(missing.length){console.error('Missing from site/:',missing);process.exit(1);}
          console.log('all',uniq.length,'local references resolve');
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
