name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies (typescript)
        run: npm ci
      - name: Types generation + freshness check + unit tests
        run: npm run ci

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies
        run: npm ci
      - name: Install the Chromium build Playwright expects
        run: npx playwright install --with-deps chromium
      - name: Playwright suite
        run: npm run test:e2e
      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
